<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="50%" stop-color="#2ea043" />
      <stop offset="100%" stop-color="#196c2e" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>

    <!-- Globe Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388bfd" />
      <stop offset="100%" stop-color="#56d364" />
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#30363d" stroke-width="6" />

  <!-- Background Tech Orbit Circles -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#21262d" stroke-width="4" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#30363d" stroke-width="2" />

  <!-- Shield Base Shape -->
  <path d="M 256 90 
           C 340 90 400 120 400 180 
           C 400 300 290 380 256 420 
           C 222 380 112 300 112 180 
           C 112 120 172 90 256 90 Z" 
        fill="#161b22" 
        stroke="url(#ringGrad)" 
        stroke-width="8" 
        filter="url(#glow)" />

  <!-- Stylized Globe Grid inside Shield -->
  <!-- Longitude Lines -->
  <ellipse cx="256" cy="245" rx="50" ry="95" fill="none" stroke="#58a6ff" stroke-width="4" opacity="0.7" />
  <ellipse cx="256" cy="245" rx="90" ry="95" fill="none" stroke="#58a6ff" stroke-width="3" opacity="0.4" />
  
  <!-- Latitude Lines -->
  <line x1="165" y1="210" x2="347" y2="210" stroke="#58a6ff" stroke-width="3" opacity="0.5" />
  <line x1="166" y1="250" x2="346" y2="250" stroke="#58a6ff" stroke-width="4" opacity="0.8" />
  <line x1="185" y1="290" x2="327" y2="290" stroke="#58a6ff" stroke-width="3" opacity="0.5" />

  <!-- Central Lightning / Key / DNS Node Signal -->
  <path d="M 270 160 L 225 240 L 260 240 L 240 320 L 295 230 L 260 230 Z" 
        fill="#56d364" 
        filter="url(#glow)" />

  <!-- Active Status Indicator Dot on Shield Corner -->
  <circle cx="360" cy="140" r="14" fill="#3fb950" stroke="#0d1117" stroke-width="4" filter="url(#glow)" />
</svg>
